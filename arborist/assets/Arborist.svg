<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101d3d"/><stop offset="1" stop-color="#060b1a"/>
    </linearGradient>
    <linearGradient id="zone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb000" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffb000" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="soma" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ff8fb0"/><stop offset="1" stop-color="#dc143c"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="16" y="16" width="480" height="480" rx="104"/></clipPath>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <!-- sensory SC between the pial surface and the CR border (parallel surfaces) -->
    <path d="M -20 175 Q 256 0 532 175 L 532 340 Q 256 165 -20 340 Z" fill="url(#zone)"/>
    <path d="M -20 175 Q 256 0 532 175" fill="none" stroke="#00e5ff" stroke-width="16" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M -20 340 Q 256 165 532 340" fill="none" stroke="#ffb000" stroke-width="10" stroke-dasharray="26 16" stroke-linecap="round"/>
    <!-- dendrites: wide-field fan towards the surface -->
    <g fill="none" stroke="#3ddc6e" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <path d="M 256 290 C 225 235 170 195 110 140"/>
      <path d="M 172 200 C 160 165 168 140 158 108"/>
      <path d="M 256 290 C 262 225 250 160 256 92"/>
      <path d="M 254 175 C 228 152 220 128 208 100"/>
      <path d="M 256 290 C 290 235 345 195 402 140"/>
      <path d="M 342 200 C 354 165 346 140 356 108"/>
      <path d="M 256 290 C 215 296 178 312 140 334"/>
    </g>
    <!-- axon with the ankyrin-G AIS -->
    <path d="M 256 318 L 258 345" stroke="#3a86ff" stroke-width="13" stroke-linecap="round"/>
    <path d="M 258 345 L 263 412" stroke="#ff2bd6" stroke-width="18" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 263 412 C 268 445 248 475 262 520" fill="none" stroke="#3a86ff" stroke-width="12" stroke-linecap="round"/>
    <circle cx="256" cy="296" r="36" fill="url(#soma)" filter="url(#glow)"/>
  </g>
</svg>
